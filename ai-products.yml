name: AI product discovery

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 04:20 UTC (09:20 Pakistan Standard Time).
    - cron: "20 4 * * *"

permissions:
  contents: write

jobs:
  discover-products:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Discover new product suggestions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: node scripts/discover-products.js

      - name: Commit updated product catalog
        run: |
          if git diff --quiet -- products.json; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Update AI product suggestions"
          git push
